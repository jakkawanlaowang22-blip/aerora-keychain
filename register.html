<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AERORA | Register Keychain</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.container {
    max-width: 430px;
    margin: auto;
    padding: 30px 20px;
}

.logo {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 5px;
    margin: 20px 0 5px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px 20px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
}

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

#message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    display: none;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">AERORA</div>

    <div class="subtitle">
        Aviation Keychain
    </div>

    <div class="card">

        <h2>✈️ ลงทะเบียนพวงกุญแจ</h2>

        <label>Keychain Code</label>
        <input id="code" type="text" placeholder="เช่น AR001">

        <label>ชื่อเจ้าของ</label>
        <input id="owner_name" type="text" placeholder="ชื่อของคุณ">

        <label>ช่องทางติดต่อ</label>
        <input id="contact" type="text" placeholder="เช่น LINE / Instagram">

       <button onclick="registerKeychain()">
    ลงทะเบียน
</button>

        <div id="message"></div>

    </div>

</div>

<script>

const SUPABASE_URL = "https://twiomyfacdgrszhejrsq.supabase.co";

/*
  ใส่ Publishable key ของเพื่อนตรงนี้
  แทนคำว่า YOUR_PUBLISHABLE_KEY
*/
const SUPABASE_KEY = "sb_publishable_vFbpyfTND-hsbf0c8gtk1Q_vQXiRyWE";


async function registerKeychain() {

    const code = document
        .getElementById("code")
        .value
        .trim()
        .toUpperCase();

    const owner_name = document
        .getElementById("owner_name")
        .value
        .trim();

    const contact = document
        .getElementById("contact")
        .value
        .trim();

    const message = document
        .getElementById("message");

    message.style.display = "block";

    if (!code || !owner_name || !contact) {

        message.innerHTML =
            "❌ กรุณากรอกข้อมูลให้ครบทุกช่อง";

        return;
    }

    try {

        const response = await fetch(
            SUPABASE_URL + "/rest/v1/owners",
            {
                method: "POST",

                headers: {
    "Content-Type": "application/json",
    "apikey": SUPABASE_KEY,
    "Prefer": "return=minimal"
},

                body: JSON.stringify({
                    code: code,
                    owner_name: owner_name,
                    contact: contact
                })
            }
        );

        if (!response.ok) {

            const error = await response.text();

            console.log(error);

            message.innerHTML =
    "❌ ลงทะเบียนไม่สำเร็จ<br><br>" +
    "Error: " + error;

            return;
        }

        message.innerHTML = `
    <strong>✅ ลงทะเบียนสำเร็จ!</strong>
    <br><br>
    รหัสพวงกุญแจ: <strong>${code}</strong>
    <br>
    เจ้าของ: ${owner_name}
    <br><br>
    ข้อมูลถูกบันทึกเข้าสู่ระบบ AERORA แล้ว
`;

    } catch (error) {

        console.log(error);

        message.innerHTML =
            "❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้";
    }
}

</script>

</body>
</html>
