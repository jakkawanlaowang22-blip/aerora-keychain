<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AERORA | Aviation Keychain</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.container {
    max-width: 430px;
    margin: auto;
    padding: 25px 20px 40px;
}

.logo {
    text-align: center;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 6px;
    margin-top: 25px;
}

.tagline {
    text-align: center;
    color: #777;
    margin-top: 5px;
    margin-bottom: 35px;
}

.card {
    background: white;
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h2 {
    margin-top: 0;
    text-align: center;
}

.description {
    text-align: center;
    color: #777;
    line-height: 1.6;
}

label {
    display: block;
    margin-top: 25px;
    margin-bottom: 8px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 17px;
    text-transform: uppercase;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #111;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

.result {
    display: none;
    margin-top: 20px;
    padding: 18px;
    background: #f5f5f5;
    border-radius: 15px;
    line-height: 1.7;
}

.footer {
    text-align: center;
    margin-top: 30px;
    color: #888;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">AERORA</div>

    <div class="tagline">
        Aviation Keychain
    </div>

    <div class="card">

        <h2>✈️ Keychain Finder</h2>

        <p class="description">
            พบพวงกุญแจ AERORA?
            <br>
            กรุณากรอกรหัสที่อยู่บนพวงกุญแจ
        </p>

        <label for="code">
            Keychain Code
        </label>

        <input
            id="code"
            type="text"
            placeholder="เช่น AR001"
        >

        <button onclick="findKeychain()">
            ตรวจสอบรหัส
        </button>

        <div class="result" id="result"></div>

    </div>

    <div class="footer">
        © 2026 AERORA Aviation Keychain
    </div>

</div>

<script>

function findKeychain() {

    const code = document
        .getElementById("code")
        .value
        .trim()
        .toUpperCase();

    const result = document
        .getElementById("result");

    if (code === "AR001") {

        result.style.display = "block";

        result.innerHTML = `
            <strong>พบข้อมูลพวงกุญแจ ✅</strong>
            <br><br>
            รหัสพวงกุญแจ: <strong>AR001</strong>
            <br>
            สถานะ: ลงทะเบียนแล้ว
            <br><br>
            หากคุณพบพวงกุญแจชิ้นนี้
            กรุณาติดต่อ AERORA เพื่อส่งคืนเจ้าของ
        `;

    } else {

        result.style.display = "block";

        result.innerHTML = `
            ❌ ไม่พบรหัส <strong>${code}</strong>
            <br><br>
            กรุณาตรวจสอบรหัสบนพวงกุญแจอีกครั้ง
        `;

    }
}

</script>

</body>
</html>
